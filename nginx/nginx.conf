events {}

http {
    server {
        listen 80;
        listen 443 ssl;
        server_name ws1.mindbodyengineer.com;

        # TLS
        ssl_certificate        /etc/letsencrypt/live/ws1.mindbodyengineer.com/fullchain.pem;
        ssl_certificate_key    /etc/letsencrypt/live/ws1.mindbodyengineer.com/privkey.pem;
        ssl_protocols          TLSv1.2 TLSv1.3;
        ssl_ciphers            HIGH:!aNULL:!MD5;

        # Serve static files
        location /static/ {
            alias /usr/share/nginx/html/;
            try_files $uri $uri/ =404;
        }

        # WebSocket proxy
        location /ws/ {
            proxy_pass http://chat-server:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default 404
        location / {
            return 404;
        }
    }
}
