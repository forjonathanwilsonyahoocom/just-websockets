services:
  nginx:
    build: ./nginx
    container_name: nginx
    restart: unless-stopped
    depends_on:
      - node
    ports:
      - "80:80"      # expose only what you need
      - "443:443"   # uncomment if you add SSL
    networks:
      - backend
    # Optional healthcheck – Nginx itself is usually fine
    # healthcheck:
    #   test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3

  node:
    build: ./node
    container_name: websocket-demo-node
    restart: unless-stopped
    environment:
      NODE_ENV: production
    networks:
      - backend
    # If you want to expose the node port to the host (e.g. for debugging)
    # ports:
    #   - "3000:3000"

networks:
  backend:
    driver: bridge

