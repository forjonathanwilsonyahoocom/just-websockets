services:
  proxy-and-client:
    build: ./ws
    image: proxy-and-client:latest
    ports:
      - 10000:10000
      - 443:443
      - 80:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${LETSENCRYPT_PATH}:/etc/nginx/certs:ro
    mem_limit: 128m
    ulimits:
      nofile: 4096
