events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;


    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        
        server_name _;

        ssl_certificate     /etc/ssl_sink/certs/sink/fullchain.pem;
        ssl_certificate_key /etc/ssl_sink/certs/sink/privkey.pem;
        return 444;
    }
    
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }
    
    server {
        listen 80;
        listen [::]:80;

        server_name ${ENDPOINT};

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name ${ENDPOINT};

        ssl_certificate     /etc/nginx/certs/live/${ENDPOINT}/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/${ENDPOINT}/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;

        # -----------------------------------------------------------------
        # 3️⃣ Serve the static front‑end (no proxy)
        # -----------------------------------------------------------------
        # default for nginx:stable-alpine
        root   /usr/share/nginx/html;
        index  index.html index.htm;


    }
}

